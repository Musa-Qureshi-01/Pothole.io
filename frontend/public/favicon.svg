<svg width="512" height="512" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --r-color: #0c3f72;      /* Navy blue R in light mode */
      --road-bg: #ffffff;      /* White road background */
      --road-dash: #0c3f72;    /* Navy blue dashed line */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --r-color: #ffffff;    /* White R in dark mode */
        --road-bg: #0f172a;    /* Dark slate road background */
        --road-dash: #ffffff;  /* White dashed line */
      }
    }
  </style>
  <!-- Stylized R -->
  <path d="M50 160V55C50 46.7157 56.7157 40 65 40H115C139.853 40 160 60.1472 160 85C160 104.991 146.967 121.933 129 127.632L158.4 160H118.8L93.6 130H70V160H50Z" fill="var(--r-color)" />
  
  <!-- Road Background -->
  <path d="M58 152C75 125 105 95 136 85" stroke="var(--road-bg)" stroke-width="10" stroke-linecap="round" fill="none" />
  
  <!-- Dashed Center Line -->
  <path d="M58 152C75 125 105 95 136 85" stroke="var(--road-dash)" stroke-width="2" stroke-dasharray="5,6" stroke-linecap="round" fill="none" />
  
  <!-- Location Pin -->
  <path d="M125 65C125 51.1929 136.193 40 150 40C163.807 40 175 51.1929 175 65C175 80 150 105 150 105C150 105 125 80 125 65Z" fill="#f29815" />
  
  <!-- Pin Center Dot -->
  <circle cx="150" cy="65" r="7" fill="var(--road-bg)" />
</svg>